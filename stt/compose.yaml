name: basai-stt

services:
  stt:
    image: basai-stt:6.6.0
    pull_policy: never
    container_name: basai-stt

    environment:
      BASAI_API_KEY: ${BASAI_API_KEY:?BASAI_API_KEY wajib diisi}
      BASAI_MODEL: turbo
      BASAI_DEVICE: cuda
      BASAI_COMPUTE_TYPE: int8_float16

    gpus: all
    ports:
      - "127.0.0.1:18066:8000"
    volumes:
      - basai_models:/models

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=1024m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    init: true

    restart: unless-stopped
    stop_grace_period: 2m

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  basai_models:
    external: true
    name: basai-stt-stage66_basai_models
