services:
  basai-stt:
    build: .
    image: basai-stt:6.6.0
    environment:
      BASAI_API_KEY: ${BASAI_API_KEY:?API key belum diset}
      BASAI_MODEL: turbo
      BASAI_DEVICE: cuda
      BASAI_COMPUTE_TYPE: int8_float16
    gpus: all
    ports:
      - "127.0.0.1:18066:8000"
    volumes:
      - basai_models:/models
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=1024m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  basai_models:
